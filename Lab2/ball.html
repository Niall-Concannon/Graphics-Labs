
<!DOCTYPE html>

<html>

  <head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style type="text/css">
      body {
          background-color: white;
      }
      canvas {
        border: black;
        border-style: solid;        
      }
    </style>

  </head>

  <body>

    <h1>Niall Concannon</h1>

    <canvas id="canvas-for-ball" width="400" height="400"></canvas>

    <script type="text/javascript">
      // Gets a handle to the element with id canvasOne.
      var canvas = document.getElementById("canvas-for-ball");
      // Get a 2D context for the canvas.
      var ctx = canvas.getContext("2d");
      
      // The vertical location of the ball.
      var y = 10;
      
      // Variables for the object
      var x = 50;
      var r = 5;
      var yspeed = 5;
      var xspeed = 10;

      // Ball class
      class Ball {
        constructor(x, y, xspeed, yspeed, r) {
          this.x = x;
          this.y = y;
          this.xspeed = xspeed;
          this.yspeed = yspeed;
          this.r = r;
        }

        // Move method used to move the ball
        move() {
          x += xspeed;
          y += yspeed;
          
          // if ball hits top or bottom
          if(y == 400) {
            yspeed = -5; // Reverse the speed
          } else if(y == 0) {
            yspeed = 5;
          }

          // if ball hits left or right
          if(x == 400) {
            xspeed = -10;
          } else if(x == 0) {
            xspeed = 10;
          }
        }

        draw() {
          ctx.beginPath();
          ctx.arc(x, y, r, 0, 2 * Math.PI);
          ctx.stroke();
        }
      }

      // Create ball object
      const b1 = new Ball(x, y, xspeed, yspeed, r);
      
      // A function to repeat every time the animation loops.
      function repeatme() {
        ctx.clearRect(0, 0, 400, 400); // Clear the canvas everytime
        
        b1.draw(); // Draw the ball (stroked, not filled).
        
        b1.move(); // Update the y location.

        window.requestAnimationFrame(repeatme);
      }
      
      // Get the animation going.
      repeatme();
    </script>

  </body>

</html>
