
<!DOCTYPE html>

<html>

  <head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style type="text/css">
      body {
          background-color: white;
      }
      canvas {
        border: black;
        border-style: solid;        
      }
    </style>

  </head>

  <body>

    <h1>Niall Concannon</h1>

    <canvas id="canvas-for-ball" width="400" height="500"></canvas>

    <script type="text/javascript">
      // Gets a handle to the element with id canvasOne.
      var canvas = document.getElementById("canvas-for-ball");
      // Get a 2D context for the canvas.
      var ctx = canvas.getContext("2d");
      
      // Ball class
      class Ball {
        constructor(x, y, xspeed, yspeed, r) {
          this.x = x;
          this.y = y;
          this.xspeed = xspeed;
          this.yspeed = yspeed;
          this.r = r;
        }

        // Move method used to move the ball
        move() {
          this.x += this.xspeed;
          this.y += this.yspeed;
          
          // if ball hits top or bottom
          if(this.y == 500 - this.r) {
            this.yspeed = -5; // Reverse the speed
          } else if(this.y == 0 + this.r) {
            this.yspeed = 10;
          }

          // if ball hits left or right
          if(this.x == 400 - this.r) {
            this.xspeed = -10;
          } else if(this.x == 0 + this.r) {
            this.xspeed = 5;
          }
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.r, (7*Math.PI)/4,(5*Math.PI)/4,false);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(this.x,this.y);
          var xline = (this.r * Math.cos((5*Math.PI)/4)) + this.x;
          var yline = (this.r * Math.sin((5*Math.PI)/4)) + this.y;
          ctx.lineTo(xline, yline);
          ctx.moveTo(this.x,this.y);
          var xline = (this.r * Math.cos((7*Math.PI)/4)) + this.x;
          var yline = (this.r * Math.sin((7*Math.PI)/4)) + this.y;
          ctx.lineTo(xline, yline);
          ctx.stroke();
        }
      }

      // Create ball object
      const b1 = new Ball(50, 10, 10, 5, 20);
      
      // A function to repeat every time the animation loops.
      function repeatme() {
        ctx.clearRect(0, 0, 400, 500); // Clear the canvas everytime
        
        b1.draw(); // Draw the ball (stroked, not filled).
        
        b1.move(); // Update the y location.

        window.requestAnimationFrame(repeatme);
      }
      
      // Get the animation going.
      repeatme();
    </script>

  </body>

</html>
