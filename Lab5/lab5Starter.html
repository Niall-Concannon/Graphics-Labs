<!DOCTYPE html>
<html>
<!--Import Three.js CDN-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<head>
    <meta charset="UTF-8">
    <title></title>
    <style type="text/css">
    </style>
</head>

<body>
    <script type="text/javascript">
        
        // Implement scene - Create a Three.js scene to hold objects.
        var scene = new THREE.Scene();

        // Create a camera with specified properties.
        var camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        // Set camera position

        // Implement renderer - Create a WebGL renderer for rendering the scene.
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Add sphere
        // const geometry = new THREE.SphereGeometry( 1, 32, 32 ); 
        // const material = new THREE.MeshLambertMaterial( { color: 0x0077ff } ); 
        // const sphere = new THREE.Mesh(geometry, material);
        // scene.add(sphere);

        var spotLight = new THREE.SpotLight(0xffffff);
        spotLight.position.set(1, 0.5, 1);
        scene.add(spotLight);

        class Sphere {
            constructor() {
                this.geometry = new THREE.SphereGeometry( 1, 32, 32 );
                this.material = new THREE.MeshLambertMaterial( { color: 0x0077ff } );
                this.sphere = new THREE.Mesh(this.geometry, this.material);
                this.direction = 0.01;
                scene.add(this.sphere);
            }
        
            move() {
                // Code to rotate sphere
                this.sphere.rotation.x += 0.01;
                this.sphere.rotation.y += 0.01;

                this.sphere.position.x += this.direction;

                if (this.sphere.position.x > 2 || this.sphere.position.x < -2) {
                    this.direction = -this.direction;
                }
            }
        }

        const s1 = new Sphere();

        function repeatMe() {            
            renderer.render(scene, camera);
            
            s1.move();

            requestAnimationFrame(repeatMe);
        }

        repeatMe();
        
    </script>
</body>

</html>
