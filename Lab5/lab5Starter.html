<!DOCTYPE html>
<html>
<!--Import Three.js CDN-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<head>
    <meta charset="UTF-8">
    <title></title>
    <style type="text/css">
    </style>
</head>

<body>
    <script type="text/javascript">
        
        // Implement scene - Create a Three.js scene to hold objects.
        var scene = new THREE.Scene();

        // Create a camera with specified properties.
        var camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        // Set camera position

        // Implement renderer - Create a WebGL renderer for rendering the scene.
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Add sphere
        const geometry = new THREE.SphereGeometry( 1, 32, 32 ); 
        const material = new THREE.MeshLambertMaterial( { color: 0x0077ff } ); 
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        var spotLight = new THREE.SpotLight(0xffffff);
        spotLight.position.set(1, 0.5, 1);
        scene.add(spotLight);

        var direction = 0.01;

        function repeatMe() {            
            renderer.render(scene, camera);
            
            // Code to rotate sphere
            sphere.rotation.x += 0.01;
            sphere.rotation.y += 0.01;

            sphere.position.x += direction;

            if (sphere.position.x > 2 || sphere.position.x < -2) {
                direction = -direction;
            }

            requestAnimationFrame(repeatMe);
        }

        repeatMe();
        
    </script>
</body>

</html>
