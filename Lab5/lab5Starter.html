<!DOCTYPE html>
<html>
<!--Import Three.js CDN-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<head>
    <meta charset="UTF-8">
    <title></title>
    <style type="text/css">
    </style>
</head>

<body>
    <h1>Niall Concannon</h1>
    
    <script type="text/javascript">
        
        // Implement scene - Create a Three.js scene to hold objects.
        var scene = new THREE.Scene();

        // Create a camera with specified properties.
        var camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Set camera position
        camera.position.z = 12;
        camera.position.y = 3;

        // Implement renderer - Create a WebGL renderer for rendering the scene.
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled= true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Create spotlight
        var spotLight = new THREE.SpotLight(0xffffff);
        spotLight.position.set(5, 10, 5);
        spotLight.castShadow = true;
        scene.add(spotLight);

        const helper = new THREE.CameraHelper( spotLight.shadow.camera );
        scene.add( helper );

        // Make the plane
        const geometry = new THREE.PlaneGeometry( 10, 10 );
        const material = new THREE.MeshLambertMaterial( {color: 0xffff00, side: THREE.DoubleSide} );
        const plane = new THREE.Mesh( geometry, material );
        plane.rotation.x = -Math.PI/2;
        plane.position.y = -2;
        plane.receiveShadow = true;
        scene.add( plane );

        // Transparent cube (box)
        const cubeGeometry = new THREE.BoxGeometry( 6, 6, 6 ); 
        const cubeMaterial = new THREE.MeshStandardMaterial( {transparent: true, opacity: 0.2, side: THREE.BackSide} ); 
        const cube = new THREE.Mesh( cubeGeometry, cubeMaterial ); 
        cube.position.y = 1;
        scene.add(cube);
        

        class Sphere {
            constructor(x, y, xspeed, insideCube) {
                this.geometry = new THREE.SphereGeometry( 1, 32, 32 );
                this.material = new THREE.MeshLambertMaterial( { color: 0x0077ff } );
                this.sphere = new THREE.Mesh(this.geometry, this.material);
                this.sphere.castShadow = true;
                this.position = this.sphere.position;
                this.yspeed = 0;
                this.gravity = -0.01;
                this.position.x = x;
                this.position.y = y;
                this.xspeed = xspeed;
                this.yspeed = 0;
                this.zspeed = 0.03;
                this.insideCube = insideCube;
                // Set gravity depending on whether it bounces in cube or not
                if (insideCube) {
                    this.gravity = 0; // No gravity inside the cube
                    this.zspeed = 0.03;

                    // Add wireframe to the sphere
                    var wireframeMaterial = new THREE.MeshBasicMaterial( { wireframe: true } );
                    var wireframe = new THREE.Mesh(this.geometry, wireframeMaterial);
                    this.sphere.add(wireframe);
                    
                } else {
                    this.gravity = -0.01; // Falls to the ground
                    this.zspeed = 0;
                }
                scene.add(this.sphere);
            }
        
            move() {
                // Code to rotate sphere
                this.sphere.rotation.x += 0.01;
                this.sphere.rotation.y += 0.01;

                this.yspeed += this.gravity;
                this.position.y += this.yspeed;

                this.position.x += this.xspeed;
                this.position.z += this.zspeed;

                if (this.insideCube == true) {
                    var cubeBorder = 3;

                    // If hits x axis reverse xspeed
                    if (this.position.x > cubeBorder - 1 || this.position.x < -cubeBorder + 1) {
                        this.xspeed = -this.xspeed;
                    }

                    // If hits z axis reverse zspeed
                    if (this.position.z > cubeBorder - 1 || this.position.z < -cubeBorder + 1) {
                        this.zspeed = -this.zspeed;
                    }
                } else {
                    //Code for bounce
                    if (this.position.y - 1 <= plane.position.y) {
                        // Once sphere is on plane keep the position above the plane
                        this.position.y = plane.position.y + 1;
                        
                        // Gravity code
                        this.yspeed = -this.yspeed * 0.8;
                    }

                    // Code to move sphere left and right
                    this.sphere.position.x += this.xspeed;

                    if (this.position.x > 2 || this.position.x < -2) {
                        this.xspeed = -this.xspeed;
                    }
                }
            }
        }

        const s1 = new Sphere(0, 1, 0.03, false);
        const s2 = new Sphere(0, 1, -0.03, true);

        function collisions(s1, s2) {
            // Get spheres positions
            var s1X = s1.position.x;
            var s1Y = s1.position.y;
            var s1Z = s1.position.z;
            var s2X = s2.position.x;
            var s2Y = s2.position.y;
            var s2Z = s2.position.z;

            var radius = 2;

            // Get the distance between spheres
            var distance = Math.sqrt(Math.pow((s1X - s2X), 2) + Math.pow((s1Y - s2Y), 2) + Math.pow((s1Z - s2Z), 2));

            // Calculate difference on x axis to decide push direction
            var xDistance = s1X - s2X;

            if (distance < radius) {
                // Reverse xspeed
                if (s1.xspeed > 0) {
                    s1.xspeed = -s1.xspeed;
                } else if (s1.xspeed < 0) {
                    s1.xspeed = -s1.xspeed;
                }

                // Reverse xspeed
                if (s2.xspeed > 0) {
                    s2.xspeed = -s2.xspeed;
                } else if (s2.xspeed < 0) {
                    s2.xspeed = -s2.xspeed;
                }

                // Stop spheres overlapping
                if (xDistance > 0) {
                    // Move to the distance of (radius - distance)
                    s1.position.x = s1X + (radius - distance);
                    s2.position.x = s2X - (radius - distance);
                } else {
                    s1.position.x = s1X - (radius - distance);
                    s2.position.x = s2X + (radius - distance);
                }
            }
        }

        function repeatMe() {            
            renderer.render(scene, camera);
            
            s1.move();
            s2.move();

            // Collision check
            collisions(s1, s2)

            requestAnimationFrame(repeatMe);
        }

        repeatMe();
        
    </script>
</body>

</html>
