<!DOCTYPE html>

<html>

<script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>
  <head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style type="text/css">
		canvas {
			border: 1px solid grey; 
		}
    </style>

  </head>

  <body>

    <h1>Niall Concannon</h1>

    <canvas id="canvas-for-ball" width="300" height="400"></canvas>

    <script type="text/javascript">
		// Gets a handle to the element with id canvasOne.
		var canvas = document.getElementById("canvas-for-ball");
		// Get a 2D context for the canvas.
		var ctx = canvas.getContext("2d");
		// Make the fill style red.
		ctx.fillStyle = "rgb(255, 0, 0)";

        // Calculates the x,y position of the DOM in the canvas
        var canvasPosition = {
            x: canvas.offsetLeft,
            y: canvas.offsetTop
        }
        
        canvas.addEventListener("click", function(event) { 
            // To get the actual coordinates for mouse position | minus client by canvasPosition
            var mouse = {
                x: event.clientX - canvasPosition.x,
                y: event.clientY - canvasPosition.y
            }

            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 6, 0, 2 * Math.PI);
            ctx.fill();
            
            noClicks += 1;
            console.log(noClicks);
            console.log(event);
        });

        // ---------- KEYBOARD CODE ----------        

		// Add a Javascript event listener to the keypress event.
		window.addEventListener("keypress", function(event) { 
			// Just log the event to the console.
			console.log(event);
		});

		//keypresses with jQuery
		$(document.body).on('keydown', function(e) {
			console.log(e.which);
			switch (e.which) {
			// key code for left arrow
			case 37:
				console.log('left arrow key pressed!');
                
                // If hits the canvas border
                if (p1.x != 0) {
                    p1.x += -5;
                }
				break;

			// key code for right arrow
			case 39:
				console.log('right arrow key pressed!');
                
                // if hits the canvas border
                if (p1.x + p1.width != 300) {
                    p1.x += 5;
                }
				break;
			}
		});

        // ---------- BOUNCING BALL CODE ----------

        // Variables for rotating the ball
        var i = 0.1;
        var rotate = true;
        var clockwise = 0.1;
        var anticlockwise = -0.1;
        
        // Ball class
        class Ball {
            constructor(x, y, xspeed, yspeed, r) {
                this.x = x;
                this.y = y;
                this.xspeed = xspeed;
                this.yspeed = yspeed;
                this.r = r;
            }

            // Move method used to move the ball
            move() {
                this.x += this.xspeed;
                this.y += this.yspeed;
                
                // if ball hits top or bottom
                if(this.y == 400 - this.r) {
                    this.yspeed = -2; // Reverse the speed
                } else if(this.y == 0 + this.r) {
                    this.yspeed = 2;
                }

                // if ball hits left or right
                if(this.x == 300 - this.r) {
                    this.xspeed = -2;
                } else if(this.x == 0 + this.r) {
                    this.xspeed = 2;
                }
            }
            
            draw() {
                ctx.fillStyle = "rgb(255,255,0)";
                // Pacman circle
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.arc(this.x, this.y, this.r, (7*Math.PI)/4+i,(5*Math.PI)/4+i,false);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Pacman mouth
                ctx.beginPath();
                ctx.moveTo(this.x,this.y);
                var xline = (this.r * Math.cos((5*Math.PI)/4+i)) + this.x;
                var yline = (this.r * Math.sin((5*Math.PI)/4+i)) + this.y;
                ctx.lineTo(xline, yline);
                ctx.moveTo(this.x,this.y);
                var xline = (this.r * Math.cos((7*Math.PI)/4+i)) + this.x;
                var yline = (this.r * Math.sin((7*Math.PI)/4+i)) + this.y;
                ctx.lineTo(xline, yline);
                ctx.stroke();

                // if statement to check whether to rotate clockwise or anticlockwise based on the boolean value
                if (rotate == true) {
                    i += clockwise;
                } else if (rotate == false) {
                    i += anticlockwise;
                }
            }

            // Rotate method rotates the ball clockwise or anticlockwise when ball hits the canvas border
            rotate() {
                // if ball hits border
                if (this.y == 400 -this.r || this.y == 0 + this.r || this.x == 300 - this.r || this.x == 0 + this.r) {
                    // if clockwise make anticlockwise
                    if (rotate == true) {
                    rotate = false;
                    } 
                    // else if anticlockwise make clockwise
                    else if (rotate == false) {
                    rotate = true;
                    }
                }
            }
        }

        // Paddle class
        class Paddle {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }

            draw() {
                ctx.fillStyle = "rgb(175,175,175)";
                ctx.moveTo(this.x, this.y);
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }

        // Create ball object
        const b1 = new Ball(50, 10, 2, 2, 10);
        const p1 = new Paddle(125, 350, 50, 10);
        
        // A function to repeat every time the animation loops.
        function repeatme() {
            ctx.clearRect(0, 0, 300, 400); // Clear the canvas everytime
            
            p1.draw(); // Draw the paddle
            
            b1.draw(); // Draw the ball (stroked, not filled).
            
            b1.move(); // Update the y location.

            b1.rotate(); // Rotates the ball

            window.requestAnimationFrame(repeatme);
        }
        
        // Get the animation going.
        repeatme();
    </script>

  </body>

</html>
